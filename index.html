<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SAT Word Game</title>

        <link rel="stylesheet" href="styles.css">

        <script src="./scripts/script.js" defer></script>
        <script src="./scripts/utils.js" defer></script>
    </head>
    <body>
        <header>
            <h1>SAT Word Game</h1>
            <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Quidem repellat quos eos doloribus molestias quis odio dolorum quaerat, itaque aliquid.</p>
        </header>
        <br>

        <main id="container">
            <div class="game-body">
                <div id="notification">
                    <h3 id="notif-title"></h3>
                    <h4 id="notif-description"></h4>
                </div>

                <h2 id="timer">Time: <span id="time">0</span>s</h2>
                <div id="game-element">
                    <p id="description">Use the provided letters to unscramble the word.</p>
                    <div id="scrambled"></div>
                    <form id="inputBoxes"></form>
                </div>
            </div>

            <div class="leaderboard">
                <h3>Leaderboard</h3>
                <p>Current Score: <span id="score"></span></p>
                <ol id="leaderboard">
                    
                </ol>
                <button onclick="showLeaderboardModal()">Submit Score to Leaderboard</button>
                <br><br>
                <a target="_blank" href="https://docs.google.com/spreadsheets/d/1F1qLNaVaq1vICHP7ZwJh4PY92PzEKR0YbNWjApgM9Fc/edit?usp=sharing"><i>View full leaderboard...</i></a>
            </div>
        </main>

        <div id="modal"></div>

        <div id="leadmodal">
            <label for="leadname"><h2>What is your name?</h2></label>
            <input type="text" placeholder="John Doe" name="name" id="leadname" autocomplete="name" required>
            <br><br>
            <button onclick="confirmLeaderboard()" id="leadconfirm">Submit</button>
            <button onclick="document.getElementById('leadmodal').style.display = 'none'">Cancel</button>
        </div>
    </body>
</html>
